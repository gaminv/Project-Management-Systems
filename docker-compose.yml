version: '3.8'

services:
  client:
    build:
      context: .        # всё в корне
      dockerfile: Dockerfile
    ports:
      - '5173:80'
    restart: always
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '4000:8080'
    restart: always
